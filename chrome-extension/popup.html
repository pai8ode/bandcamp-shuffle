<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bandcamp Shuffle</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <section class="now">
      <div class="art" id="art" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </div>
      <div class="meta">
        <div class="title" id="title">Nothing playing</div>
        <div class="artist" id="artist">Shuffle your Bandcamp collection</div>
        <div class="album" id="album"></div>
      </div>
    </section>

    <div class="status" id="status" role="status"></div>

    <section class="controls">
      <button id="pause" class="round" title="Pause" hidden>
        <svg viewBox="0 0 24 24"><path id="pause-icon" d="M8 5v14M16 5v14"/></svg>
      </button>
      <button id="main" class="primary">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        <span id="main-label">Shuffle</span>
      </button>
      <button id="stop" class="round" title="Stop" hidden>
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      </button>
    </section>

    <label class="volume">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      <input type="range" id="volume" min="0" max="100" step="5" aria-label="Bandcamp volume">
      <output id="volume-value">100%</output>
    </label>

    <footer>
      <span id="releases"></span>
      <button id="sync" class="link">Resync</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
