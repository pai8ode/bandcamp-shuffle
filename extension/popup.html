<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bandcamp Shuffle</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <section class="source">
      <div class="source-text">
        <span class="source-label">Collection</span>
        <span class="source-name" id="fan-name">p</span>
        <span class="source-user" id="fan-user">@fedexlatte</span>
      </div>
      <button id="change" class="link" aria-expanded="false" aria-controls="picker">Change</button>
    </section>

    <section class="picker" id="picker" hidden>
      <input id="picker-input" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search users or paste bandcamp.com/username"
             aria-label="Search Bandcamp users or paste a profile link">
      <ul class="results" id="results" role="listbox" aria-label="Collections"></ul>
      <div class="picker-foot">
        <button id="reset" class="link">Back to fedexlatte</button>
      </div>
    </section>

    <section class="now">
      <div class="art" id="art" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </div>
      <div class="meta">
        <div class="title" id="title">Nothing playing</div>
        <div class="artist" id="artist">Shuffle the fedexlatte collection</div>
        <div class="album" id="album"></div>
      </div>
      <button id="star" class="star" title="Add to favorites" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
      </button>
    </section>

    <div class="status" id="status" role="status"></div>

    <section class="controls">
      <button id="pause" class="round" title="Pause" hidden>
        <svg viewBox="0 0 24 24"><path id="pause-icon" d="M8 5v14M16 5v14"/></svg>
      </button>
      <button id="main" class="primary">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        <span id="main-label">Shuffle</span>
      </button>
      <button id="stop" class="round" title="Stop" hidden>
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      </button>
    </section>

    <label class="volume">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      <input type="range" id="volume" min="0" max="100" step="5" aria-label="Bandcamp volume">
      <output id="volume-value">100%</output>
    </label>

    <label class="fav-only" id="fav-only-row">
      <input type="checkbox" id="fav-only" role="switch">
      <span class="switch" aria-hidden="true"></span>
      <span class="fav-only-text">Shuffle favorites only <span id="fav-only-count"></span></span>
    </label>

    <section class="favs" id="favs" hidden>
      <div class="favs-head">
        <strong>Favorites</strong>
        <button id="favs-close" class="link">Done</button>
      </div>
      <div class="favs-actions">
        <button id="copy" class="chip" title="Copy as Artist - Song lines for TuneMyMusic or Soundiiz">Copy for Spotify/Apple Music</button>
        <button id="dl-txt" class="chip" title="Download Bandcamp Favorites.txt">.txt</button>
        <button id="dl-csv" class="chip" title="Download Bandcamp Favorites.csv">.csv</button>
      </div>
      <div class="favs-note" id="favs-note" role="status"></div>
      <ul class="fav-list" id="fav-list"></ul>
    </section>

    <footer>
      <span id="releases"></span>
      <span class="footer-links">
        <button id="favs-link" class="link">Favorites</button>
        <button id="sync" class="link">Resync</button>
      </span>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
